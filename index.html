<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layover Lane — Bus Rest-Stop Simulator</title>
<meta name="description" content="Run the layover every tour bus trusts: feed hungry guests, work the ₺20 toilet counter — cologne, change, clean the stalls with the hose. Click the WC building to step inside the counter room and take the money. No profit, no upgrades.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">🚌 LAYOVER LANE <span class="sub">bus rest-stop simulator</span></div>
    <div class="hud">
      <div class="stat" id="statServed" title="Guests served today">👥 0</div>
      <div class="stat" id="statClock" title="Day &amp; time">Day 1 · 08:00</div>
      <div class="stat rep" title="Reputation — higher rep means more buses stop">
        ★ <div class="bar"><div id="repFill"></div></div><span id="repNum">50</span>
      </div>
      <div class="stat" id="statCologne" title="Cologne left in the counter bottle (refills at midnight)">🧴 500 ml</div>
      <button id="btnClean" class="icon" title="Grab the hose and clean the stalls (hold & drag over a free stall)">🚿</button>
      <button id="btnWc" class="icon" title="Step inside the WC counter (E)">🚻</button>
      <button id="btnPause" class="icon" title="Pause (Space)">⏸</button>
      <button id="btnSpeed" class="icon" title="Game speed (1/10/100/200)">1×</button>
      <button id="btnHelp" class="icon" title="How to play">?</button>
      <button id="btnReset" class="icon" title="Reset game">↺</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="toasts"></div>
  </div>
</div>

<div id="modal" class="hidden">
  <div id="modalBox">
    <h1 id="modalTitle"></h1>
    <div id="modalBody"></div>
    <button id="modalBtn"></button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
