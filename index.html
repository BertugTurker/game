<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10141f">
<title>Mola Yeri — Otobüs Mola Tesisi Simülatörü</title>
<meta name="description" content="Her tur otobüsünün güvendiği mola yerini işlet: iki alaturka tuvalet ve bir el fırçasıyla başla, gişede para üstü ver, kazandığınla tesisini büyüt — daha iyi tuvaletler, ekipman, oto yıkama ve yeni terminaller.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="toasts"></div>

    <!-- Burger menu button and drawer -->
    <div id="headerBar">
      <div id="statServed" title="Bugün hizmet verilen misafir">👥 0</div>
      <button id="cashChip" title="Şirket kasası — İşletme paneli (U)" aria-label="Şirket kasası, işletme panelini aç">₺0</button>
      <button id="btnBurger" class="icon" aria-label="Menü" title="Menüyü Aç/Kapat">☰</button>
    </div>
    <div id="sideControls">
      <button id="mapBtn" class="icon" title="Bölge haritası (M)" aria-label="Bölge haritası">🗺</button>
      <button id="btnShop" class="icon" title="Yükseltmeler ve ekipman (U)" aria-label="İşletme">🛠️</button>
      <button id="btnPause" class="icon" title="Duraklat (Boşluk)" aria-label="Oyunu duraklat">⏸</button>
    </div>
    <div id="mapPanel" class="hidden" role="region" aria-label="Bölge haritası">
      <div class="mapHead">
        <strong id="mapTitle">Bölge haritası</strong>
        <button id="btnMapClose" class="icon" title="Harita panelini kapat" aria-label="Harita panelini kapat">✕</button>
      </div>
      <div id="mapDetail"></div>
      <div id="mapActions"></div>
    </div>
    <div id="burgerBackdrop" class="hidden"></div>
    <div id="burgerMenu" class="hidden">
      <div class="burgerHeader">
        <div class="brand">🚌 MOLA YERİ <span class="ver">v0.005</span></div>
        <button id="btnBurgerClose" class="icon" title="Kapat">✕</button>
      </div>
      <div class="burgerBody">
        <div class="burgerSection">
          <div class="burgerSectionTitle">DURUM</div>
          <div class="hud hudWrap">
            <div class="stat" id="statCash" title="Şirket kasası — bütün terminaller ortak">₺0</div>
            <div class="stat" id="statTerm" title="Bulunduğun terminal">—</div>
            <div class="stat" id="statClock" title="Gün ve saat">Gün 1 · 08:00</div>
            <div class="stat rep" title="İtibar — itibar yükseldikçe daha çok otobüs uğrar">
              ★ <div class="bar"><div id="repFill"></div></div><span id="repNum">50</span>
            </div>
          </div>
        </div>
        <div class="burgerSection">
          <div class="burgerSectionTitle">KONTROLLER</div>
          <div class="burgerControls">
            <button id="btnSpeed" title="Oyun hızı (1/10/100/200)">1×</button>
            <button id="btnReset" title="Oyunu sıfırla">↺</button>
            <button id="btnHelp" title="Nasıl oynanır">?</button>
          </div>
          <div class="burgerControls">
            <button id="btnTestCash" title="Test için: kasaya ₺100.000 ekle">🧪 +₺100.000</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Small portrait screens only (see style.css): the 16:9 scene wants landscape -->
<div id="rotateHint" aria-hidden="true">
  <div class="rhIcon">📱</div>
  <div class="rhText">
    <strong>Cihazı yatay çevir</strong>
    <span>Mola Yeri geniş ekran için tasarlandı</span>
  </div>
</div>

<div id="shop" class="hidden" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
  <div id="shopBox">
    <div class="shopHead">
      <h1 id="shopTitle">🏗 Geliştirmeler</h1>
      <button id="btnShopClose" class="icon" title="Kapat (Esc)" aria-label="Kapat">✕</button>
    </div>
    <div id="shopBody"></div>
  </div>
</div>

<div id="modal" class="hidden">
  <div id="modalBox">
    <h1 id="modalTitle"></h1>
    <div id="modalBody"></div>
    <button id="modalBtn"></button>
  </div>
</div>

<script src="game.js"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
