<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141f">
<title>Mola Yeri — Otobüs Mola Tesisi Simülatörü</title>
<meta name="description" content="Her tur otobüsünün güvendiği mola yerini işlet: aç misafirleri doyur, ₺20'lik tuvalet gişesine bak — kolonya, para üstü, hortumla kabin temizliği. Gişeye girip parayı almak için WC binasına tıkla. Kâr yok, geliştirme yok.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">🚌 MOLA YERİ <span class="ver">v0.004</span></div>
    <div class="hud">
      <div class="stat" id="statServed" title="Bugün hizmet verilen misafir">👥 0</div>
      <div class="stat" id="statClock" title="Gün ve saat">Gün 1 · 08:00</div>
      <div class="stat rep" title="İtibar — itibar yükseldikçe daha çok otobüs uğrar">
        ★ <div class="bar"><div id="repFill"></div></div><span id="repNum">50</span>
      </div>
      <button id="btnWc" class="icon" title="WC gişesine gir (E)">🚻</button>
      <button id="btnPause" class="icon" title="Duraklat (Boşluk)">⏸</button>
      <button id="btnSpeed" class="icon" title="Oyun hızı (1/10/100/200)">1×</button>
      <button id="btnHelp" class="icon" title="Nasıl oynanır">?</button>
      <button id="btnReset" class="icon" title="Oyunu sıfırla">↺</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="toasts"></div>
  </div>
</div>

<!-- Small portrait screens only (see style.css): the 16:9 scene wants landscape -->
<div id="rotateHint" aria-hidden="true">
  <div class="rhIcon">📱</div>
  <div class="rhText">
    <strong>Cihazı yatay çevir</strong>
    <span>Mola Yeri geniş ekran için tasarlandı</span>
  </div>
</div>

<div id="modal" class="hidden">
  <div id="modalBox">
    <h1 id="modalTitle"></h1>
    <div id="modalBody"></div>
    <button id="modalBtn"></button>
  </div>
</div>

<script src="game.js"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
